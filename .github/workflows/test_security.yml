name: Test k-NN on Secure Cluster
on:
  schedule:
    - cron: '0 0 * * *'  # every night
  push:
    branches:
      - "*"
      - "feature/**"
  pull_request:
    branches:
      - "*"
      - "feature/**"

jobs:
  check-files:
    name: Check file for Test k-NN on Secure Cluster
    runs-on: ubuntu-latest
    outputs:
      RUN_SECURE_IT_TEST: ${{ steps.check.outputs.files_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check files
        id: check
        uses: ./.github/actions/check-files
        with:
          files: .github/workflows/test_security.yml

  Get-CI-Image-Tag:
    needs: check-files
    if: needs.check-files.outputs.RUN_SECURE_IT_TEST == 'true'
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  integ-test-with-security-linux:
    strategy:
      matrix:
        java: [21, 25]
    # The CI image now ships GCC 13+ after deprecating AL2
    # (see opensearch-build#5227). All native libraries (nmslib, faiss, simd)
    # compile with the default toolchain in a single step.

    name: Run Integration Tests on Linux
    runs-on: ubuntu-latest
    needs: Get-CI-Image-Tag
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      - name: Checkout k-NN
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Setup git user so that patches for native libraries can be applied and committed
      - name: Setup git user
        run: |
          su `id -un 1000` -c 'git config --global user.name "github-actions[bot]"'
          su `id -un 1000` -c 'git config --global user.email "github-actions[bot]@users.noreply.github.com"'

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run build
        # switching the user, as OpenSearch cluster can only be started as root/Administrator on linux-deb/linux-rpm/windows-zip.
        #
        # Two-step compile: nmslib is built separately from faiss/simd because they require
        # different SIMD flag sets. We detect the SIMD tier from lscpu and pass the appropriate
        # -Davx*.enabled flags. Java build/tests run in the second stage.
        run: |
          set -euo pipefail
          chown -R 1000:1000 `pwd`

          if lscpu | grep -i avx512f | grep -i avx512cd | grep -i avx512vl | grep -i avx512dq | grep -i avx512bw > /dev/null
          then
            if lscpu | grep -q "GenuineIntel" && lscpu | grep -i avx512_fp16 | grep -i avx512_bf16 | grep -i avx512_vpopcntdq > /dev/null
            then
              echo "the system is an Intel(R) Sapphire Rapids or a newer-generation processor"
              SIMD_FLAGS="-Davx512_spr.enabled=true"
            else
              echo "avx512 available on system"
              SIMD_FLAGS="-Davx512_spr.enabled=false"
            fi
          elif lscpu | grep -i avx2 > /dev/null
          then
            echo "avx2 available on system"
            SIMD_FLAGS="-Davx512.enabled=false -Davx512_spr.enabled=false"
          else
            echo "avx512 and avx2 not available on system"
            SIMD_FLAGS="-Davx2.enabled=false -Davx512.enabled=false -Davx512_spr.enabled=false"
          fi

          NPROC=`nproc`
          # Step 1: build nmslib (disable all SIMD tiers since nmslib doesn't use them).
          echo "=== Step 1: build nmslib ==="
          su `id -un 1000` -c "whoami && java -version && \
              ./gradlew :buildJniLib -Pknn_libs=opensearchknn_nmslib \
                                     -Davx2.enabled=false -Davx512.enabled=false -Davx512_spr.enabled=false \
                                     -Dnproc.count=${NPROC}"

          # Wipe cmake configure cache so step 2 picks up the correct SIMD tier.
          # The release/ output dir is preserved so libopensearchknn_nmslib.so stays intact.
          rm -rf jni/build/CMakeCache.txt jni/build/CMakeFiles

          # Step 2: build faiss/simd and run the full gradle build (Java compile, test, integTest).
          # -Dbuild.lib.apply_patches=false: patches were already applied in step 1.
          echo "=== Step 2: build faiss/simd + run Java build ==="
          su `id -un 1000` -c "whoami && java -version && \
              ./gradlew build -Pknn_libs=opensearchknn_faiss,opensearchknn_simd ${SIMD_FLAGS} \
                              -Dbuild.lib.apply_patches=false -Dnproc.count=${NPROC}"

  check-results:
    needs: [check-files, integ-test-with-security-linux]
    if: always()
    name: Check results Test k-NN on Secure Cluster
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ needs.check-files.outputs.RUN_SECURE_IT_TEST && needs.integ-test-with-security-linux.result == 'failure' }}
        run: |
          echo "Integration tests failed, failing the check-results step"
          exit 1