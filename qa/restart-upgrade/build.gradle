    def invalidPrefixesForQFrameBitEncoderAnd1bitScalarQuantizerBWCChecks = ['1.'] + ((0..16).collect { "2.${it}." } as Collection<String>)
    if (invalidPrefixesForQFrameBitEncoderAnd1bitScalarQuantizerBWCChecks.any { knn_bwc_version.startsWith(it) }) {
