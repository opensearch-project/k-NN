pluginManagement {
    repositories {
        maven { url "https://ci.opensearch.org/maven2/" }
        maven { url "https://ci.opensearch.org/m2/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'opensearch-knn'

include ":qa"
include ":qa:rolling-upgrade"
include ":qa:restart-upgrade"
include ":remote-index-build-client"

// The sandbox/ tree is excluded from the build graph unless -Pknn.sandbox.enabled=true (release builds
// never pass the flag), see sandbox/README.md. Subprojects are enumerated explicitly so that a
// directory dropped into sandbox/ cannot join the build without a reviewed change to this file.
if (providers.gradleProperty('knn.sandbox.enabled').getOrElse('false') == 'true') {
    include ":sandbox"
    include ":sandbox:common"
    include ":sandbox:svs"
}

